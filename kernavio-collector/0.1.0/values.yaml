cluster:
  # Kernavio cluster ID (cls_...). Informational: logged by the collector, never sent. The token identifies the cluster.
  id: ""

# event-ingester base URL.
endpoint: https://ingest.kernavio.com

# API key from the Kernavio console (kv_col_...). Required on the first install only: the chart stores it in a
# Secret and reuses it on every upgrade. Pass it again only to rotate it.
apiKey: ""
# Or manage the Secret yourself (Argo CD, External Secrets, ...): its name, and the key that holds the API key.
existingSecret: ""
existingSecretKey: api-key

image:
  repository: ghcr.io/stiravia/images/kernavio-collector
  tag: ""  # defaults to the chart's appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

logLevel: info

# Send the hostnames found in ConfigMap values (never the values, which are always hashed), so Kernavio can see
# calls configured through ConfigMaps in the dependency graph. false: ConfigMaps contribute no calls edges.
configMapHosts: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""

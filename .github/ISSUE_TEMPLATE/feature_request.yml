name: Feature request
description: Suggest an improvement to a chart.
labels: [enhancement]
body:
  - type: dropdown
    id: chart
    attributes:
      label: Chart
      options:
        - kernavio-collector
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do that the chart does not support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How would you like it to work?

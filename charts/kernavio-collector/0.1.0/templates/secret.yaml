{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "collector.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "collector.labels" . | nindent 4 }}
type: Opaque
data:
  api-key: {{ include "collector.apiKeyB64" . | quote }}
{{- end }}
